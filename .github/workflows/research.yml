name: demand-radar
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours — free forever on public repos
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python researcher.py
      - name: Commit report + leaderboard
        run: |
          git config user.name "demand-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/ LEADERBOARD.md || true
          git commit -m "radar sweep $(date -u +%F_%H:%M)" || echo "nothing new"
          git push
